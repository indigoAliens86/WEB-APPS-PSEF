      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="blister" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="80" height="80" rx="12" fill="#eff6ff"/>
  <!-- Medicine box -->
  <rect x="12" y="18" width="56" height="44" rx="6" fill="url(#boxGrad)" filter="drop-shadow(0 2px 4px rgba(37,99,235,0.2))"/>
  <rect x="12" y="32" width="56" height="16" fill="#ffffff" opacity="0.95"/>
  <rect x="16" y="23" width="14" height="4" rx="2" fill="#93c5fd"/>
