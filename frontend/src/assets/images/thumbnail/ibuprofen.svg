    <rect x="9" y="0" width="9" height="6" rx="3" fill="#60a5fa"/>
  </g>
  <text x="16" y="43" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#1e40af">IBUPROFEN</text>
  <text x="16" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="600" fill="#ffffff" opacity="0.9">400 mg</text>
